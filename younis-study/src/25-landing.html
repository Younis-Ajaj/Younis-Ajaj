<div class="landing" id="landing">
  <header class="lnav">
    <div class="lwrap">
      <div class="brand">
        <svg width="38" height="38" viewBox="0 0 64 64" aria-hidden="true" class="brandmark"><rect x="1" y="1" width="62" height="62" rx="17" fill="#18284D" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/><path d="M13 47c11-5 26-5 38-2" stroke="#FFE14D" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M21 16 32 30 43 16M32 30v17" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path class="spark" d="M50 9.5l1.7 4.3 4.3 1.7-4.3 1.7-1.7 4.3-1.7-4.3-4.3-1.7 4.3-1.7z" fill="#7FE3B2"/></svg>
        <div><b data-t="brand"></b><small data-t="tagline"></small></div>
      </div>
      <nav class="links"><button type="button" data-jump="l-feat" data-t="l_navFeat"></button><button type="button" data-jump="l-how" data-t="l_navHow"></button><button type="button" data-jump="l-arab" data-t="l_navArab"></button><button type="button" data-jump="l-faq" data-t="l_navFaq"></button></nav>
      <button class="iconbtn" id="lTheme" type="button" data-ta="aTheme"><svg><use href="#i-moon"/></svg></button>
      <button class="iconbtn" id="lLang" type="button"></button>
      <button class="btn primary sm" type="button" data-go-app></button>
    </div>
  </header>

  <section class="lhero">

        <p class="sub" data-t="l_sub"></p>
        <div class="actions">
          <button class="btn primary big" type="button" data-go-app></button>
          <button class="btn ghost" type="button" data-jump="l-how" data-t="l_how"></button>
        </div>
        <div class="trust"><span data-t="l_t1"></span><span data-t="l_t2"></span><span data-t="l_t3"></span><span data-t="l_t4"></span></div>
      </div>
      <div class="scene" aria-hidden="true">

          <g font-family="IBM Plex Mono,monospace" font-size="22" fill="var(--ink-soft)">
            <text class="sc-sym" x="170" y="230">∑</text><text class="sc-sym s2" x="250" y="210">π</text><text class="sc-sym s3" x="330" y="225" font-family="Lalezar,Readex Pro,sans-serif">ض</text><text class="sc-sym s4" x="210" y="240">√x</text>
          </g>
          <rect x="20" y="362" width="520" height="16" rx="8" fill="var(--sheet-2)" stroke="var(--rule)" stroke-width="2"/>
          <polygon class="sc-glow" points="62,150 30,360 190,360 120,150" fill="var(--hl1)" opacity=".28"/>
          <path d="M70 356h60" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>

          <path d="M98 168c4-26 34-36 52-20l-8 26z" fill="var(--hl5)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>

            <path class="sc-sym s3" d="M211 312c-6-8 6-12 0-20" stroke="var(--ink-soft)" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
          <polygon points="236,262 340,274 340,352 230,342" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
          <polygon points="340,274 446,262 452,342 340,352" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
          <g stroke="var(--rule)" stroke-width="2"><path d="M250 292l80 8M250 308l80 8M250 324l80 8"/></g>
          <rect class="sc-hl" x="354" y="286" width="84" height="11" rx="3" fill="var(--hl1)" opacity=".85"/>
          <g stroke="var(--ink-soft)" stroke-width="2.5" stroke-linecap="round" fill="none">

          </g>
          <g id="sceneOwl"></g>
          <g class="sc-float" style="--r:-8deg"><g transform="translate(150 140) rotate(-8)"><rect width="96" height="62" rx="10" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2.5"/><rect x="12" y="14" width="50" height="8" rx="4" fill="var(--hl2)"/><path d="M12 34h70M12 46h48" stroke="var(--rule)" stroke-width="4" stroke-linecap="round"/></g></g>
          <g class="sc-float d2" style="--r:6deg"><g transform="translate(270 70) rotate(6)"><rect width="104" height="66" rx="10" fill="var(--hl1)" stroke="var(--ink)" stroke-width="2.5"/><text x="52" y="44" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="22" font-weight="600" fill="#15213B">x̄ ± σ</text></g></g>

        </svg>
      </div>
    </div>
  </section>

  <section class="lsec" id="l-feat">
    <div class="lwrap">
      <h2 data-t="l_featH"></h2>
      <p class="lede2" data-t="l_featLede"></p>
      <div class="feat" id="featGrid"></div>
    </div>
  </section>

  <section class="lsec" id="l-how" style="padding-top:20px">
    <div class="lwrap">
      <h2 data-t="l_howH"></h2>
      <p class="lede2" data-t="l_howLede"></p>
      <div class="steps3" id="howGrid"></div>
      <div class="preview" style="margin-top:40px">
        <div class="pv">
          <div class="pvbar"><i></i><i></i><i></i></div>
          <div class="pvgrid">
            <div class="sheet" style="box-shadow:none"><p class="soft small" style="margin:0" data-t="countFirst"></p><div class="display num" style="font-size:3.4rem;line-height:1.1">12</div><div class="strip" style="background:var(--hl1);margin-top:8px"><span><strong data-t="l_pv1"></strong><span data-t="l_pv1s"></span></span><em class="num">2h</em></div><div class="strip" style="background:var(--hl3);margin-top:7px"><span><strong data-t="l_pv2"></strong><span data-t="l_pv2s"></span></span><em class="num">1.5h</em></div></div>
            <div class="sheet" style="box-shadow:none"><p class="soft small" style="margin:0 0 8px" data-t="readyH"></p><div class="rings" id="pvRings"></div></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="lsec" id="l-arab">
    <div class="lwrap arab">
      <div>
        <h2 style="text-align:start" data-t="l_arabH"></h2>
        <p class="soft" style="margin:0 0 20px" data-t="l_arabLede"></p>
        <ul id="arabList"></ul>
      </div>
      <div class="mockcard tape">
        <p class="soft small" style="margin:0" id="mkGreg"></p>
        <div class="hij" id="mkHijri"></div>
        <p class="soft small" style="margin:10px 0 0" id="mkPrayLbl"></p>
        <div class="prayrow" id="mkPray"></div>
        <p class="quote" style="margin-top:16px" id="mkQuote"></p>
      </div>
    </div>
  </section>

  <section class="lsec" id="l-faq" style="padding-top:10px">
    <div class="lwrap">
      <h2 data-t="l_faqH"></h2>
      <div class="faq" id="faqList" style="margin-top:24px"></div>
    </div>
  </section>

  <div class="lwrap">
    <section class="lcta">
      <div id="ctaOwl"></div>
      <h2 class="display" style="font-size:clamp(1.8rem,4vw,2.5rem);margin:0 0 8px" data-t="l_ctaH"></h2>
      <p data-t="l_ctaP"></p>
      <button class="btn hl" type="button" data-go-app></button>
    </section>
  </div>
  <footer class="lfoot"><div class="lwrap"><p style="margin:0" data-t="credit"></p></div></footer>
</div>

<div class="onb" id="onb" hidden role="dialog" aria-modal="true">
  <div class="onbcard">
    <button class="onbx" id="onbX" type="button" aria-label="×">×</button>
    <div class="pdots" id="onbDots"></div>
    <div class="onbtop"><span id="onbOwl"></span><div class="bubble" id="onbSay"></div></div>
    <div class="onbstep" id="onbStep"></div>
    <p class="error" id="onbErr" role="alert" hidden></p>
    <div class="onbnav"><button class="btn ghost" id="onbBack" type="button"></button><button class="link" id="onbDemo" type="button"></button><button class="btn primary" id="onbNext" type="button"></button></div>
  </div>
</div>
