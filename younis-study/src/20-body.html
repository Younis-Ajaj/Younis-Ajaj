            </div>
            <div class="row ai-only" style="margin-top:10px">
              <div class="field"><label for="tCourse" data-t="course"></label><input type="text" id="tCourse" list="courseList" data-tp="courseP" autocomplete="off"><datalist id="courseList"></datalist></div>
              <div class="field" style="flex-grow:2"><label for="tTopic" data-t="topic"></label><input type="text" id="tTopic" data-tp="topicP" autocomplete="off"></div>
            </div>
            <div style="margin-top:12px"><label for="tFile" data-t="fileL"></label><input type="file" id="tFile" multiple accept=".pdf,.docx,.pptx,.xlsx,.txt,.md,.csv"><p class="soft small" id="fileMsg" style="margin:4px 0 0" aria-live="polite"></p></div>
            <div style="margin-top:10px"><div class="row c" style="justify-content:space-between"><label for="tNotes" data-t="notesL" style="margin:0"></label><button class="mic" type="button" data-ta="aMic" data-mic="tNotes" hidden><svg><use href="#i-mic"/></svg></button></div><textarea id="tNotes" style="margin-top:5px"></textarea></div>
            <div class="tools" id="tools"></div>
            <div class="row c ai-only" style="margin-top:12px"><label class="row c" style="gap:8px;margin:0;color:var(--ink)"><input type="checkbox" id="examMode"><span data-t="examMode"></span></label><select id="examMin" style="width:auto;min-height:38px" data-ta="minutes"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="40">40</option></select><span class="soft small" data-t="minutes"></span></div>
          </div>
          <p class="error" id="tError" role="alert" hidden></p>
          <div class="sheet" id="tutorPanel" hidden style="margin-top:16px">
            <div class="row c" style="justify-content:space-between"><h3 id="panelTitle"></h3><div class="actions"><button class="btn sm ghost" id="ttsBtn" type="button" hidden><svg><use href="#i-speak"/></svg><span data-t="listen"></span></button><button class="btn sm ghost" id="tStop" type="button" hidden data-t="stop"></button></div></div>
            <div class="out" id="tutorOut" aria-live="polite"></div>
            <div id="tutorExtra"></div>
            <div id="askRow" hidden style="margin-top:14px">
              <label for="tAsk" data-t="askL"></label>
              <div class="row c"><div class="field"><input type="text" id="tAsk" autocomplete="off"></div><button class="mic" type="button" data-ta="aMic" data-mic="tAsk" hidden><svg><use href="#i-mic"/></svg></button><button class="btn sm primary" type="button" id="tAskBtn" data-t="ask"></button></div>
            </div>
          </div>
          <div class="sheet" id="feyBox" hidden style="margin-top:16px">
            <h3 data-t="feyH"></h3>
            <p class="soft small" style="margin:4px 0 10px" data-t="feyLede"></p>
            <div class="row c" style="justify-content:flex-end"><button class="mic" type="button" data-ta="aMic" data-mic="feyIn" hidden><svg><use href="#i-mic"/></svg></button></div>
            <textarea id="feyIn" style="margin-top:6px"></textarea>
            <div class="actions" style="margin-top:10px"><button class="btn sm primary" id="feyGo" type="button" data-t="feyGo"></button></div>
            <div id="feyOut"></div>
          </div>
          <div id="quiz"></div>
          <ul class="history" id="history"></ul>
          <p class="soft small ai-only" style="margin-top:14px" data-t="disclaimer"></p>
        </div>
      </section>

      <!-- ================= REVIEW ================= -->
      <section class="view" id="v-review">
        <header class="vhead"><h1 class="display"><span data-t="cardsH"></span></h1><p data-t="cardsLede"></p></header>
        <div class="grid split">
          <div class="sheet tape mint">
            <div id="cIdle">
              <p id="cInfo" style="margin:0"></p>
              <div class="boxes" id="cBoxes"></div>
              <div class="actions" style="margin-top:14px"><button class="btn primary" id="cStart" type="button" data-t="cStart"></button><select id="cFilter" style="width:auto;min-height:44px" data-ta="cFilterL"></select></div>
            </div>
            <div id="cReview" hidden>
              <div class="row c" style="justify-content:space-between"><span class="soft small" id="cLeft"></span><button class="link" id="cEnd" type="button" data-t="cEnd"></button></div>
              <div class="flash" id="cFlash"><div class="inner"><div class="face front"><small id="cTagF"></small><span id="cFront"></span></div><div class="face back"><small id="cTagB"></small><span id="cBack"></span></div></div></div>
              <p class="soft small" style="margin:8px 0 0" data-t="cFlip"></p>
              <div class="actions" id="cBtns" hidden style="margin-top:10px">
                <button class="btn" id="cNo" type="button" data-t="cNo"></button>
                <button class="btn" id="cHard" type="button" data-t="cHard"></button>
                <button class="btn primary" id="cYes" type="button" data-t="cYes"></button>
                <button class="link" id="cDel" type="button" data-t="cDel"></button>
              </div>
            </div>
          </div>
          <div class="sheet">
            <h3 data-t="cNewH"></h3>
            <div style="margin-top:8px"><label for="cQ" data-t="cQ"></label><input type="text" id="cQ" autocomplete="off"></div>
            <div style="margin-top:8px"><label for="cA" data-t="cA"></label><input type="text" id="cA" autocomplete="off"></div>
            <div style="margin-top:8px"><label for="cSub" data-t="cSub"></label><select id="cSub"></select></div>
            <button class="btn sm primary" id="cAdd" type="button" style="margin-top:12px" data-t="cAdd"></button>
          </div>
        </div>
        <h2 class="sec"><span data-t="mistH"></span><span class="chip" id="mistCount"></span></h2>
        <div class="sheet"><p class="soft small" style="margin:0" data-t="mistLede"></p><div class="actions ai-only" style="margin-top:10px"><button class="btn sm hl" id="mistAIBtn" type="button"><svg><use href="#i-tutor"/></svg><span data-t="mistAI"></span></button></div><div class="out" id="mistAIOut" aria-live="polite"></div><ul class="mlist" id="mlist"></ul></div>
      </section>

      <!-- ================= MY UNIVERSITY: catalog and graduation tracker ================= -->
      <section class="view" id="v-uni">
        <header class="vhead"><h1 class="display"><span data-t="uniH"></span></h1><p data-t="uniLede"></p></header>
        <div id="uniBody"></div>
      </section>

      <!-- ================= STATS ================= -->
      <section class="view" id="v-stats">
        <header class="vhead"><h1 class="display"><span data-t="statsH"></span></h1><p data-t="statsLede"></p></header>
        <div class="kpis" id="sKpis"></div>
        <h2 class="sec" data-t="repH"></h2>
        <div class="sheet tape mint"><p class="soft small" style="margin:0 0 10px" data-t="repLede"></p><div class="actions ai-only"><button class="btn sm hl" id="repBtn" type="button"><svg><use href="#i-tutor"/></svg><span data-t="repBtn"></span></button><button class="btn sm ghost" id="repStop" type="button" hidden data-t="stop"></button></div><p class="soft small noai-only" style="margin:0" id="repNoAI" data-t="repNoAI"></p><div class="out" id="repOut" aria-live="polite"></div></div>
        <h2 class="sec" data-t="heatH"></h2>
        <div class="sheet"><div class="heat"><div class="g" id="heat"></div></div><div class="hkey"><span data-t="less"></span><i style="background:var(--rule)"></i><i style="background:color-mix(in srgb,var(--hl3) 40%,var(--rule))"></i><i style="background:color-mix(in srgb,var(--hl3) 70%,var(--rule))"></i><i style="background:var(--hl3)"></i><i style="background:color-mix(in srgb,var(--hl3) 70%,var(--ink))"></i><span data-t="more"></span></div></div>
        <div class="grid g2" style="margin-top:16px">
          <div class="sheet"><h3 data-t="last14H"></h3><div class="bars14" id="bars14"></div></div>
          <div class="sheet"><h3 data-t="bySubH"></h3><div class="donut" id="donut" style="margin-top:10px"></div></div>
        </div>
        <h2 class="sec" data-t="shareH"></h2>
        <div class="sheet tape pink"><p class="soft small" style="margin:0 0 10px" data-t="shareLede"></p><button class="btn sm hl" id="shareBtn" type="button" data-t="shareBtn"></button><div id="sharePrev" class="sharePrev" hidden></div></div>
        <h2 class="sec" data-t="badgesH"></h2>
        <div class="badges" id="badges"></div>
        <div class="sheet tape" id="profBox" style="margin-top:28px"></div>
        <h2 class="sec" data-t="dataH"></h2>
        <div class="sheet">
          <p class="soft small" style="margin:0 0 10px" data-t="dataLede"></p>
          <div class="actions">
            <button class="btn sm" id="expBtn" type="button"><svg><use href="#i-down"/></svg><span data-t="exp"></span></button>
            <label class="btn sm ghost" style="margin:0;color:var(--ink)"><svg><use href="#i-up"/></svg><span data-t="imp"></span><input type="file" id="impFile" accept=".json" hidden></label>
            <button class="link" id="wipeBtn" type="button" data-t="wipe"></button>
          </div>
          <div class="banner warn" id="wipeAsk" hidden style="margin:12px 0 0"><p data-t="wipeQ"></p><button class="btn sm" id="wipeYes" type="button" data-t="wipeYes"></button><button class="btn sm ghost" id="wipeNo" type="button" data-t="cancel"></button></div>
        </div>
      </section>

      <!-- ================= GRADES ================= -->
      <section class="view" id="v-grades">
        <header class="vhead"><h1 class="display"><span data-t="gradesH"></span></h1><p data-t="gradesLede"></p></header>
        <div class="grid g2">
          <div class="sheet tape">
            <h3 data-t="gradeH"></h3>
            <div class="row" style="margin-top:10px">
              <div class="field"><label for="gNow" data-t="gNow"></label><input type="number" id="gNow" inputmode="decimal" min="0" max="100"></div>
              <div class="field"><label for="gFinal" data-t="gFinal"></label><input type="number" id="gFinal" inputmode="decimal" min="1" max="100"></div>
            </div>
            <ul class="glist" id="gOut"></ul>
          </div>
          <div class="sheet tape pink">
            <h3 data-t="gpaH"></h3>
            <div id="gpaRows" style="margin-top:10px"></div>
            <button class="btn sm ghost" id="gpaAdd" type="button" data-t="gpaAdd"></button>
            <div class="row c" style="margin-top:14px;justify-content:space-between;align-items:center">
              <div><span class="soft small" data-t="gpaSem"></span><div class="gpabig" id="gpaOut">0.00</div></div>
              <div><span class="soft small" data-t="gpaCum"></span><div class="gpabig" id="gpaCumOut" style="font-size:2rem">—</div></div>
            </div>
            <div class="row" style="margin-top:12px">
              <div class="field"><label for="gpaPrev" data-t="gpaPrev"></label><input type="number" id="gpaPrev" step="0.01" min="0" max="4" inputmode="decimal"></div>
              <div class="field"><label for="gpaPrevH" data-t="gpaPrevH"></label><input type="number" id="gpaPrevH" min="0" inputmode="numeric"></div>
              <div class="field"><label for="gpaTarget" data-t="gpaTarget"></label><input type="number" id="gpaTarget" step="0.01" min="0" max="4" inputmode="decimal"></div>
            </div>
            <p class="soft small" id="gpaHint" style="margin:10px 0 0"></p>
          </div>
        </div>
      </section>

      <footer class="foot"><p><span data-t="foot"></span> <span id="sync"></span></p><p data-t="credit"></p></footer>
    </div>
  </main>
</div>
